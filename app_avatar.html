<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIOS Lip Sync Avatar</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0e17;
    color: #e0e6f0;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
}
#header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    background: linear-gradient(180deg, rgba(10,14,23,0.95), rgba(10,14,23,0.7));
    padding: 12px 24px;
    display: flex; align-items: center; gap: 16px;
    border-bottom: 1px solid rgba(99,179,237,0.15);
}
#header h1 {
    font-size: 16px; font-weight: 600;
    background: linear-gradient(135deg, #63b3ed, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
#status {
    font-size: 12px; color: #718096; margin-left: auto;
}
#status span { color: #63b3ed; }
button {
    background: rgba(99,179,237,0.12);
    border: 1px solid rgba(99,179,237,0.3);
    color: #63b3ed; padding: 6px 14px; border-radius: 6px;
    font-size: 12px; cursor: pointer; font-family: inherit;
    transition: all 0.2s;
}
button:hover { background: rgba(99,179,237,0.25); border-color: #63b3ed; }
#avatar-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
}
#face {
    position: relative;
    width: 280px;
    height: 320px;
    background: linear-gradient(145deg, #1a202c, #2d3748);
    border-radius: 50% 50% 45% 45%;
    border: 3px solid rgba(99,179,237,0.2);
    box-shadow: 0 0 40px rgba(99,179,237,0.08), inset 0 0 30px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
}
#eyes {
    display: flex;
    gap: 60px;
    margin-top: 30px;
}
.eye {
    width: 28px;
    height: 28px;
    background: radial-gradient(circle, #63b3ed 30%, #2b6cb0 100%);
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(99,179,237,0.5);
    transition: all 0.15s;
}
.eye.blink {
    height: 4px;
    border-radius: 2px;
    margin-top: 12px;
}
#nose {
    width: 8px;
    height: 16px;
    background: rgba(99,179,237,0.15);
    border-radius: 50%;
}
#mouth-container {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 60px;
}
#mouth {
    width: 50px;
    height: 12px;
    background: #1a202c;
    border: 2px solid rgba(99,179,237,0.4);
    border-radius: 0 0 25px 25px;
    transition: all 0.08s ease-out;
    position: relative;
}
#mouth.open-a {
    width: 50px;
    height: 40px;
    border-radius: 10px 10px 25px 25px;
    background: #0a0e17;
    border-color: rgba(99,179,237,0.6);
}
#mouth.open-o {
    width: 36px;
    height: 44px;
    border-radius: 50%;
    background: #0a0e17;
    border-color: rgba(99,179,237,0.6);
}
#mouth.open-e {
    width: 44px;
    height: 24px;
    border-radius: 4px 4px 22px 22px;
    background: #0a0e17;
    border-color: rgba(99,179,237,0.6);
}
#mouth.open-i {
    width: 28px;
    height: 30px;
    border-radius: 4px 4px 14px 14px;
    background: #0a0e17;
    border-color: rgba(99,179,237,0.6);
}
#mouth.open-ou {
    width: 30px;
    height: 38px;
    border-radius: 50%;
    background: #0a0e17;
    border-color: rgba(167,139,250,0.6);
}
#mouth.open-ll, #mouth.open-mm, #mouth.open-pp {
    width: 46px;
    height: 8px;
    border-radius: 0 0 23px 23px;
    background: #1a202c;
    border-color: rgba(99,179,237,0.3);
}
#mouth.open-ff, #mouth.open-th, #mouth.open-dd {
    width: 40px;
    height: 16px;
    border-radius: 0 0 20px 20px;
    background: #0a0e17;
    border-color: rgba(99,179,237,0.5);
}
#mouth.open-ss, #mouth.open-nn {
    width: 42px;
    height: 10px;
    border-radius: 0 0 21px 21px;
    background: #1a202c;
    border-color: rgba(99,179,237,0.35);
}
#mouth.open-kk, #mouth.open-ch {
    width: 38px;
    height: 22px;
    border-radius: 4px 4px 19px 19px;
    background: #0a0e17;
    border-color: rgba(99,179,237,0.55);
}
#mouth.open-rr {
    width: 34px;
    height: 28px;
    border-radius: 50%;
    background: #0a0e17;
    border-color: rgba(167,139,250,0.5);
}
#viseme-label {
    font-size: 14px;
    color: #a78bfa;
    min-height: 20px;
    text-align: center;
}
#log-panel {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(10,14,23,0.9);
    border-top: 1px solid rgba(99,179,237,0.15);
    padding: 8px 16px;
    max-height: 120px;
    overflow-y: auto;
    font-size: 11px;
    color: #718096;
}
#log-panel .log-entry { margin: 2px 0; }
#log-panel .log-entry .viseme { color: #a78bfa; }
#log-panel .log-entry .word { color: #63b3ed; }
#log-panel .log-entry .time { color: #4a5568; }
</style>
</head>
<body>

<div id="header">
    <h1>AIOS Lip Sync Avatar</h1>
    <button onclick="startAudio()">Start Audio</button>
    <button onclick="stopAudio()">Stop</button>
    <div id="status">
        Audio: <span id="audio-status">idle</span> |
        Viseme: <span id="viseme-status">idle</span> |
        Frames: <span id="frame-count">0</span>
    </div>
</div>

<div id="avatar-container">
    <div id="face">
        <div id="eyes">
            <div class="eye" id="eye-left"></div>
            <div class="eye" id="eye-right"></div>
        </div>
        <div id="nose"></div>
        <div id="mouth-container">
            <div id="mouth"></div>
        </div>
    </div>
    <div id="viseme-label">--</div>
</div>

<div id="log-panel"></div>

<script>
const AUDIO_STREAM_URL = 'http://127.0.0.1:8083/audio/stream';
const VISEME_SSE_URL = 'http://127.0.0.1:8083/audio/visemes';

let audioCtx = null;
let audioSource = null;
let eventSource = null;
let frameCount = 0;
let blinkInterval = null;

const visemeMouthMap = {
    'sil': '',
    'PP': 'open-pp',
    'FF': 'open-ff',
    'TH': 'open-th',
    'DD': 'open-dd',
    'kk': 'open-kk',
    'CH': 'open-ch',
    'SS': 'open-ss',
    'nn': 'open-nn',
    'RR': 'open-rr',
    'aa': 'open-a',
    'E': 'open-e',
    'I': 'open-i',
    'O': 'open-o',
    'OU': 'open-ou',
    'LL': 'open-ll',
    'MM': 'open-mm',
};

function setMouth(viseme) {
    const mouth = document.getElementById('mouth');
    const label = document.getElementById('viseme-label');

    mouth.className = '';

    const cssClass = visemeMouthMap[viseme];
    if (cssClass) {
        mouth.classList.add(cssClass);
    }

    label.textContent = viseme === 'sil' ? '--' : viseme;
}

function addLog(viseme, word, time) {
    const panel = document.getElementById('log-panel');
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `<span class="time">[${time.toFixed(2)}s]</span> ` +
        `<span class="viseme">${viseme}</span>` +
        (word ? ` <span class="word">"${word}"</span>` : '');
    panel.appendChild(entry);
    panel.scrollTop = panel.scrollHeight;

    while (panel.children.length > 50) {
        panel.removeChild(panel.firstChild);
    }
}

function startBlinking() {
    if (blinkInterval) return;
    blinkInterval = setInterval(() => {
        const left = document.getElementById('eye-left');
        const right = document.getElementById('eye-right');
        left.classList.add('blink');
        right.classList.add('blink');
        setTimeout(() => {
            left.classList.remove('blink');
            right.classList.remove('blink');
        }, 150);
    }, 3000 + Math.random() * 2000);
}

function startAudio() {
    document.getElementById('audio-status').textContent = 'connecting...';

    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {
        document.getElementById('audio-status').textContent = 'error';
        console.error('AudioContext failed:', e);
        return;
    }

    fetch(AUDIO_STREAM_URL)
        .then(response => {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            document.getElementById('audio-status').textContent = 'streaming';
            return response.arrayBuffer();
        })
        .then(buffer => {
            if (buffer.byteLength === 0) {
                document.getElementById('audio-status').textContent = 'no data';
                return;
            }

            try {
                audioCtx.decodeAudioData(buffer, (audioBuffer) => {
                    audioSource = audioCtx.createBufferSource();
                    audioSource.buffer = audioBuffer;
                    audioSource.connect(audioCtx.destination);
                    audioSource.start(0);
                    document.getElementById('audio-status').textContent = 'playing';
                }, (err) => {
                    document.getElementById('audio-status').textContent = 'decode err';
                    console.error('Decode error:', err);
                });
            } catch (e) {
                document.getElementById('audio-status').textContent = 'buffer err';
                console.error('Buffer error:', e);
            }
        })
        .catch(err => {
            document.getElementById('audio-status').textContent = 'error';
            console.error('Fetch error:', err);
        });

    startVisemeSSE();
    startBlinking();
}

function startVisemeSSE() {
    if (eventSource) {
        eventSource.close();
    }

    document.getElementById('viseme-status').textContent = 'connecting...';

    eventSource = new EventSource(VISEME_SSE_URL);

    eventSource.onopen = () => {
        document.getElementById('viseme-status').textContent = 'connected';
    };

    eventSource.onmessage = (event) => {
        try {
            const data = JSON.parse(event.data);
            frameCount++;
            document.getElementById('frame-count').textContent = frameCount;

            const viseme = data.viseme || 'sil';
            const word = data.word || '';
            const time = data.time || 0;

            setMouth(viseme);
            addLog(viseme, word, time);

            if (data.end) {
                setTimeout(() => setMouth('sil'), 300);
            }
        } catch (e) {
            console.error('Parse error:', e, event.data);
        }
    };

    eventSource.onerror = () => {
        document.getElementById('viseme-status').textContent = 'error';
    };
}

function stopAudio() {
    if (audioSource) {
        try { audioSource.stop(); } catch (e) {}
        audioSource = null;
    }
    if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
    }
    if (eventSource) {
        eventSource.close();
        eventSource = null;
    }
    if (blinkInterval) {
        clearInterval(blinkInterval);
        blinkInterval = null;
    }
    setMouth('sil');
    document.getElementById('audio-status').textContent = 'idle';
    document.getElementById('viseme-status').textContent = 'idle';
}

startBlinking();
</script>

</body>
</html>
