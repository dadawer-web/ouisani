<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIOS GraphFS Visualizer</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0e17;
    color: #e0e6f0;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    overflow: hidden;
}
#header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    background: linear-gradient(180deg, rgba(10,14,23,0.95) 0%, rgba(10,14,23,0.7) 100%);
    padding: 12px 24px;
    display: flex; align-items: center; gap: 16px;
    border-bottom: 1px solid rgba(99,179,237,0.15);
}
#header h1 {
    font-size: 16px; font-weight: 600;
    background: linear-gradient(135deg, #63b3ed, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
#stats {
    font-size: 12px; color: #718096;
    margin-left: auto;
}
#stats span { color: #63b3ed; font-weight: 600; }
button {
    background: rgba(99,179,237,0.12);
    border: 1px solid rgba(99,179,237,0.3);
    color: #63b3ed; padding: 6px 14px; border-radius: 6px;
    font-size: 12px; cursor: pointer; font-family: inherit;
    transition: all 0.2s;
}
button:hover { background: rgba(99,179,237,0.25); border-color: #63b3ed; }
#tooltip {
    position: fixed; z-index: 20;
    background: rgba(15,20,35,0.95);
    border: 1px solid rgba(99,179,237,0.4);
    border-radius: 8px; padding: 10px 14px;
    font-size: 12px; pointer-events: none;
    display: none; max-width: 320px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
#tooltip .entity-name { color: #63b3ed; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
#tooltip .edge-info { color: #a0aec0; line-height: 1.6; }
#tooltip .edge-info .rel { color: #a78bfa; }
svg { width: 100vw; height: 100vh; }
.link { stroke-opacity: 0.4; fill: none; }
.link-label {
    font-size: 9px; fill: #718096; pointer-events: none;
    text-anchor: middle; dominant-baseline: central;
}
.node-circle {
    stroke-width: 2; cursor: pointer;
    transition: r 0.2s;
}
.node-circle:hover { filter: brightness(1.3); }
.node-label {
    font-size: 11px; fill: #e0e6f0; pointer-events: none;
    text-anchor: middle; dominant-baseline: central;
    text-shadow: 0 0 6px rgba(10,14,23,0.9), 0 0 12px rgba(10,14,23,0.7);
}
#legend {
    position: fixed; bottom: 16px; left: 16px; z-index: 10;
    background: rgba(15,20,35,0.85); border: 1px solid rgba(99,179,237,0.15);
    border-radius: 8px; padding: 12px 16px; font-size: 11px;
}
#legend .title { color: #63b3ed; font-weight: 600; margin-bottom: 6px; }
#legend .item { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
#legend .dot { width: 10px; height: 10px; border-radius: 50%; }
#proxy-status {
    font-size: 11px; color: #718096;
}
#proxy-status.connected { color: #48bb78; }
#proxy-status.error { color: #fc8181; }
</style>
</head>
<body>

<div id="header">
    <h1>AIOS GraphFS Visualizer</h1>
    <button onclick="fetchGraph()">Refresh</button>
    <button onclick="toggleLabels()">Labels</button>
    <span id="proxy-status">Connecting...</span>
    <div id="stats">
        Entities: <span id="entity-count">0</span> &nbsp;|&nbsp;
        Edges: <span id="edge-count">0</span>
    </div>
</div>

<div id="tooltip">
    <div class="entity-name"></div>
    <div class="edge-info"></div>
</div>

<div id="legend">
    <div class="title">Node Degree</div>
    <div class="item"><div class="dot" style="background:#fc8181"></div> High (5+)</div>
    <div class="item"><div class="dot" style="background:#f6ad55"></div> Medium (3-4)</div>
    <div class="item"><div class="dot" style="background:#63b3ed"></div> Low (1-2)</div>
    <div class="item"><div class="dot" style="background:#4a5568"></div> Isolated (0)</div>
</div>

<svg id="graph-svg"></svg>

<script>
const PROXY_URL = 'http://127.0.0.1:8090/debug/graph';
let showLabels = true;
let simulation = null;

const colorScale = d3.scaleOrdinal()
    .range(['#63b3ed','#a78bfa','#fc8181','#f6ad55','#68d391','#f687b3','#76e4f7','#faf089']);

function degreeColor(degree) {
    if (degree >= 5) return '#fc8181';
    if (degree >= 3) return '#f6ad55';
    if (degree >= 1) return '#63b3ed';
    return '#4a5568';
}

async function fetchGraph() {
    const statusEl = document.getElementById('proxy-status');
    try {
        const resp = await fetch(PROXY_URL);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        statusEl.textContent = 'Connected';
        statusEl.className = 'connected';
        renderGraph(data);
    } catch (e) {
        statusEl.textContent = 'Proxy offline';
        statusEl.className = 'error';
        console.error('Failed to fetch graph:', e);
    }
}

function renderGraph(data) {
    const graph = data.graph || data;
    const entities = graph.entities || [];
    const edgeCount = graph.edge_count || 0;

    document.getElementById('entity-count').textContent = entities.length;
    document.getElementById('edge-count').textContent = edgeCount;

    const nodes = entities.map((e, i) => ({
        id: e.name,
        index: i,
        degree: (e.edges || []).length
    }));

    const links = [];
    entities.forEach(e => {
        (e.edges || []).forEach(edge => {
            links.push({
                source: e.name,
                target: edge.target,
                relation: edge.relation
            });
        });
    });

    const svg = d3.select('#graph-svg');
    svg.selectAll('*').remove();

    const width = window.innerWidth;
    const height = window.innerHeight;

    const g = svg.append('g');

    svg.call(d3.zoom()
        .scaleExtent([0.1, 4])
        .on('zoom', (event) => g.attr('transform', event.transform)));

    simulation = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(links).id(d => d.id).distance(120))
        .force('charge', d3.forceManyBody().strength(-400))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collision', d3.forceCollide().radius(40));

    const link = g.append('g')
        .selectAll('line')
        .data(links)
        .join('line')
        .attr('class', 'link')
        .attr('stroke', '#4a5568')
        .attr('stroke-width', d => Math.max(1, Math.min(3, 1)));

    const linkLabel = g.append('g')
        .selectAll('text')
        .data(links)
        .join('text')
        .attr('class', 'link-label')
        .text(d => d.relation.length > 20 ? d.relation.substring(0, 18) + '..' : d.relation);

    const node = g.append('g')
        .selectAll('g')
        .data(nodes)
        .join('g')
        .call(d3.drag()
            .on('start', dragStarted)
            .on('drag', dragged)
            .on('end', dragEnded));

    node.append('circle')
        .attr('class', 'node-circle')
        .attr('r', d => Math.max(8, Math.min(24, 6 + d.degree * 3)))
        .attr('fill', d => degreeColor(d.degree))
        .attr('stroke', d => d3.color(degreeColor(d.degree)).brighter(0.5))
        .on('mouseover', showTooltip)
        .on('mouseout', hideTooltip);

    node.append('text')
        .attr('class', 'node-label')
        .attr('dy', d => -(Math.max(8, Math.min(24, 6 + d.degree * 3)) + 6))
        .text(d => d.id.length > 16 ? d.id.substring(0, 14) + '..' : d.id)
        .style('display', showLabels ? 'block' : 'none');

    simulation.on('tick', () => {
        link
            .attr('x1', d => d.source.x)
            .attr('y1', d => d.source.y)
            .attr('x2', d => d.target.x)
            .attr('y2', d => d.target.y);

        linkLabel
            .attr('x', d => (d.source.x + d.target.x) / 2)
            .attr('y', d => (d.source.y + d.target.y) / 2);

        node.attr('transform', d => `translate(${d.x},${d.y})`);
    });
}

function showTooltip(event, d) {
    const tooltip = document.getElementById('tooltip');
    const entity = d;
    const relatedLinks = [];
    d3.selectAll('line').each(function(l) {
        if (l.source.id === d.id || l.target.id === d.id) {
            relatedLinks.push(l);
        }
    });

    let html = `<div class="entity-name">${d.id}</div><div class="edge-info">`;
    relatedLinks.forEach(l => {
        const arrow = l.source.id === d.id ? '--&gt;' : '&lt;--';
        const other = l.source.id === d.id ? l.target.id : l.source.id;
        html += `${arrow} <span class="rel">[${l.relation}]</span> ${other}<br>`;
    });
    if (relatedLinks.length === 0) html += 'No connections';
    html += '</div>';

    tooltip.querySelector('.entity-name').outerHTML = `<div class="entity-name">${d.id}</div>`;
    tooltip.querySelector('.edge-info').innerHTML = relatedLinks.map(l => {
        const arrow = l.source.id === d.id ? '&rarr;' : '&larr;';
        const other = l.source.id === d.id ? l.target.id : l.source.id;
        return `${arrow} <span class="rel">[${l.relation}]</span> ${other}`;
    }).join('<br>') || 'No connections';

    tooltip.style.display = 'block';
    tooltip.style.left = (event.pageX + 12) + 'px';
    tooltip.style.top = (event.pageY - 10) + 'px';
}

function hideTooltip() {
    document.getElementById('tooltip').style.display = 'none';
}

function dragStarted(event) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    event.subject.fx = event.subject.x;
    event.subject.fy = event.subject.y;
}

function dragged(event) {
    event.subject.fx = event.x;
    event.subject.fy = event.y;
}

function dragEnded(event) {
    if (!event.active) simulation.alphaTarget(0);
    event.subject.fx = null;
    event.subject.fy = null;
}

function toggleLabels() {
    showLabels = !showLabels;
    d3.selectAll('.node-label').style('display', showLabels ? 'block' : 'none');
    d3.selectAll('.link-label').style('display', showLabels ? 'block' : 'none');
}

fetchGraph();
setInterval(fetchGraph, 10000);
</script>

</body>
</html>
