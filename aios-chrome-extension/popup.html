<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AIOS Bridge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      background: #0a0e14;
      color: #b3b1ad;
      font-size: 13px;
    }
    .header {
      padding: 16px;
      border-bottom: 1px solid #1a1f29;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #00E5FF, #00B0FF);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      color: #0a0e14;
    }
    .title {
      font-size: 15px;
      font-weight: 600;
      color: #e0e0e0;
    }
    .subtitle {
      font-size: 11px;
      color: #5c6370;
    }
    .status-bar {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #1a1f29;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #FF1744;
      transition: background 0.3s;
    }
    .status-dot.connected { background: #00C853; }
    .status-dot.connecting { background: #FF6D00; animation: pulse 1s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .status-text {
      font-size: 12px;
      color: #5c6370;
    }
    .section {
      padding: 12px 16px;
      border-bottom: 1px solid #1a1f29;
    }
    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #5c6370;
      margin-bottom: 8px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 12px;
    }
    .info-key { color: #5c6370; }
    .info-val { color: #b3b1ad; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border: 1px solid #00E5FF;
      background: transparent;
      color: #00E5FF;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .btn:hover {
      background: rgba(0, 229, 255, 0.1);
    }
    .btn.danger {
      border-color: #FF1744;
      color: #FF1744;
    }
    .btn.danger:hover {
      background: rgba(255, 23, 68, 0.1);
    }
    .footer {
      padding: 10px 16px;
      text-align: center;
      font-size: 10px;
      color: #3a3f4b;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">A</div>
    <div>
      <div class="title">AIOS Bridge</div>
      <div class="subtitle">Browser Control Extension</div>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Connecting...</span>
  </div>

  <div class="section">
    <div class="section-title">Connection</div>
    <div class="info-row">
      <span class="info-key">WebSocket</span>
      <span class="info-val" id="wsUrl">-</span>
    </div>
    <div class="info-row">
      <span class="info-key">Status</span>
      <span class="info-val" id="connStatus">-</span>
    </div>
    <button class="btn" id="btnReconnect">Reconnect</button>
  </div>

  <div class="section">
    <div class="section-title">Current Tab</div>
    <div class="info-row">
      <span class="info-key">Title</span>
      <span class="info-val" id="tabTitle">-</span>
    </div>
    <div class="info-row">
      <span class="info-key">URL</span>
      <span class="info-val" id="tabUrl">-</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Settings</div>
    <button class="btn" id="btnOptions">Configure WebSocket URL</button>
  </div>

  <div class="footer">AIOS v1.0 &middot; Open Source</div>

  <script src="popup.js"></script>
</body>
</html>
