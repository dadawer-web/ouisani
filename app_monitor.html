<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIOS System Monitor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    background: #0a0e17;
    color: #c8d6e5;
    min-height: 100vh;
    padding: 20px;
}
h1 {
    text-align: center;
    font-size: 1.6rem;
    color: #00d2ff;
    margin-bottom: 8px;
    letter-spacing: 2px;
}
#status {
    text-align: center;
    font-size: 0.85rem;
    margin-bottom: 20px;
    color: #576574;
}
#status.connected { color: #10ac84; }
#status.error { color: #ee5a24; }
#dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    max-width: 1200px;
    margin: 0 auto;
}
.card {
    background: #151b2e;
    border: 1px solid #1e2a45;
    border-radius: 10px;
    padding: 18px;
    transition: border-color 0.3s;
}
.card:hover { border-color: #00d2ff44; }
.card-title {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #576574;
    margin-bottom: 10px;
}
.card-value {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 10px;
}
.progress-bar {
    width: 100%;
    height: 8px;
    background: #1e2a45;
    border-radius: 4px;
    overflow: hidden;
}
.progress-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.6s ease, background 0.6s ease;
}
.text-card {
    font-size: 0.95rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
}
.log-entry {
    background: #0d1220;
    border-left: 3px solid #00d2ff;
    padding: 10px 14px;
    border-radius: 0 6px 6px 0;
    font-size: 0.82rem;
    margin-bottom: 8px;
    animation: fadeIn 0.4s ease;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
}
#log-panel {
    max-width: 1200px;
    margin: 24px auto 0;
    background: #151b2e;
    border: 1px solid #1e2a45;
    border-radius: 10px;
    padding: 18px;
}
#log-panel h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #576574;
    margin-bottom: 12px;
}
#log-list {
    max-height: 260px;
    overflow-y: auto;
}
#log-list::-webkit-scrollbar { width: 4px; }
#log-list::-webkit-scrollbar-thumb { background: #1e2a45; border-radius: 2px; }
</style>
</head>
<body>
<h1>AIOS System Monitor</h1>
<div id="status">Connecting...</div>
<div id="dashboard"></div>
<div id="log-panel">
    <h2>Event Log</h2>
    <div id="log-list"></div>
</div>

<script>
const SSE_URL = 'http://127.0.0.1:8083/ui/stream';
const dashboard = document.getElementById('dashboard');
const logList = document.getElementById('log-list');
const statusEl = document.getElementById('status');
const cardMap = new Map();

function connect() {
    statusEl.textContent = 'Connecting...';
    statusEl.className = '';

    const es = new EventSource(SSE_URL);

    es.onopen = function() {
        statusEl.textContent = 'LIVE';
        statusEl.className = 'connected';
    };

    es.onmessage = function(event) {
        let frame;
        try {
            frame = JSON.parse(event.data);
        } catch (e) {
            appendLog(event.data, '#576574');
            return;
        }
        renderFrame(frame);
        appendLog(JSON.stringify(frame), '#00d2ff');
    };

    es.onerror = function() {
        statusEl.textContent = 'DISCONNECTED - Reconnecting...';
        statusEl.className = 'error';
        es.close();
        setTimeout(connect, 3000);
    };
}

function renderFrame(frame) {
    if (frame.type === 'dashboard' && frame.widgets) {
        frame.widgets.forEach(function(w) {
            renderWidget(w);
        });
    } else if (frame.type === 'gauge' || frame.type === 'progress' || frame.type === 'text') {
        renderWidget(frame);
    } else {
        renderWidget({ id: 'raw-' + Date.now(), type: 'text', label: 'Data', value: JSON.stringify(frame, null, 2) });
    }
}

function renderWidget(w) {
    const id = w.id || w.label || ('w-' + Math.random().toString(36).substr(2, 6));
    let card = cardMap.get(id);

    if (!card) {
        card = document.createElement('div');
        card.className = 'card';
        card.id = 'card-' + id;
        dashboard.appendChild(card);
        cardMap.set(id, card);
    }

    if (w.type === 'gauge' || w.type === 'progress') {
        const pct = Math.min(100, Math.max(0, w.value || 0));
        const color = pct > 80 ? '#ee5a24' : pct > 50 ? '#feca57' : '#10ac84';
        card.innerHTML =
            '<div class="card-title">' + escHtml(w.label || id) + '</div>' +
            '<div class="card-value" style="color:' + color + '">' + pct.toFixed(1) + '%</div>' +
            '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%;background:' + color + '"></div></div>';
    } else if (w.type === 'text') {
        card.innerHTML =
            '<div class="card-title">' + escHtml(w.label || id) + '</div>' +
            '<div class="text-card">' + escHtml(String(w.value || '')) + '</div>';
    } else {
        card.innerHTML =
            '<div class="card-title">' + escHtml(w.label || id) + '</div>' +
            '<div class="card-value" style="color:' + (w.color || '#00d2ff') + '">' + escHtml(String(w.value != null ? w.value : '')) + '</div>';
    }
}

function appendLog(text, color) {
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.style.borderLeftColor = color || '#00d2ff';
    const ts = new Date().toLocaleTimeString();
    entry.textContent = '[' + ts + '] ' + text;
    logList.insertBefore(entry, logList.firstChild);
    while (logList.children.length > 50) {
        logList.removeChild(logList.lastChild);
    }
}

function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

connect();
</script>
</body>
</html>
