<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单番茄钟</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🍅 番茄钟</h1>
        
        <div class="timer-display">
            <div id="time-display" class="time">25:00</div>
            <div id="status-text" class="status">准备开始</div>
        </div>
        
        <div class="controls">
            <button id="start-btn" class="btn btn-start">开始</button>
            <button id="pause-btn" class="btn btn-pause" disabled>暂停</button>
            <button id="reset-btn" class="btn btn-reset">重置</button>
        </div>
        
        <div class="settings">
            <h3>番茄钟设置</h3>
            <div class="setting-group">
                <label for="work-duration">工作时间（分钟）：</label>
                <input type="number" id="work-duration" value="25" min="1" max="60">
            </div>
            <div class="setting-group">
                <label for="break-duration">休息时间（分钟）：</label>
                <input type="number" id="break-duration" value="5" min="1" max="30">
            </div>
        </div>
        
        <div class="progress-section">
            <div class="progress-bar">
                <div id="progress" class="progress-fill"></div>
            </div>
            <div class="pomodoro-count">
                已完成番茄钟: <span id="completed-count">0</span>
            </div>
        </div>
        
        <div id="notification" class="notification hidden"></div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
