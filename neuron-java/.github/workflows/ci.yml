name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 同一 PR 的多次 push 取消中间的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # Quality Guardrails: 棘轮式预算门禁（借鉴 jcode CI 模式）
  # 任一预算 regression 即阻塞后续 build/test。
  # ──────────────────────────────────────────────────────────────
  budgets:
    name: Budget Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Run all budget checkers
        working-directory: ${{ github.workspace }}/neuron-java
        run: bash scripts/check_all_budgets.sh

      - name: Budget check summary
        if: always()
        working-directory: ${{ github.workspace }}/neuron-java
        run: |
          echo "## 棘轮式预算检查结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 预算 | 基线文件 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| code-size | \`scripts/budgets/code_size_budget.json\` |" >> $GITHUB_STEP_SUMMARY
          echo "| panic | \`scripts/budgets/panic_budget.json\` |" >> $GITHUB_STEP_SUMMARY
          echo "| swallowed-error | \`scripts/budgets/swallowed_error_budget.json\` |" >> $GITHUB_STEP_SUMMARY
          echo "| test-size | \`scripts/budgets/test_size_budget.json\` |" >> $GITHUB_STEP_SUMMARY
          echo "| warning | \`scripts/budgets/warning_budget.txt\` |" >> $GITHUB_STEP_SUMMARY
          echo "| dependency-boundaries | 硬性约束 + KNOWN_VIOLATIONS 允许列表 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "如需刷新基线（仅在主动清理后），本地运行：\`bash scripts/check_all_budgets.sh --update\` 然后提交基线变更。" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────
  # Build & Test: 预算通过后才编译 + 测试
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: budgets
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Maven compile
        working-directory: ${{ github.workspace }}/neuron-java
        run: mvn -B -ntp compile

      - name: Maven test
        working-directory: ${{ github.workspace }}/neuron-java
        run: mvn -B -ntp test
        continue-on-error: true  # 测试目录尚未建立，允许失败

      - name: Maven package (shade jar)
        working-directory: ${{ github.workspace }}/neuron-java
        run: mvn -B -ntp package -DskipTests

      - name: Upload shade jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aios-shade-jar
          path: neuron-java/target/aios-*.jar
          if-no-files-found: warn
          retention-days: 7
